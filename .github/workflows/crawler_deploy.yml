name: Crawler AWS Artifact CI

on:
  push:
    branches: ["crawler"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        env:
          INFORM_TEST_POSTGRES_DSN: ""
          INFORM_TEST_CRAWLER_DSN: ""
        run: python -m unittest discover -v

      - name: Compile source
        run: python -m compileall -q main.py config.py common dataprepper crawlers tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build unpublished container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: inform-crawler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
