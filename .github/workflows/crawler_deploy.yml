name: Crawler CI/CD

# 트리거: 'crawler' 브랜치에 코드가 푸시되면 실행
on:
  push:
    branches: [ "crawler" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # 깃허브의 가상 컴퓨터(Ubuntu) 사용

    steps:
    # 1. 저장소에서 코드 내려받기
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Docker Hub 로그인 (Secrets 사용)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. 도커 이미지 빌드 및 푸시 (Build & Push)
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .              # Dockerfile이 있는 경로 (루트 기준)
        push: true              # 빌드 후 즉시 업로드
        tags: ${{ secrets.DOCKER_USERNAME }}/inform-crawler:latest
        # Github Actions는 매번 새로운 환경에서 실행되므로 no-cache 옵션이 없어도 항상 깨끗하게 빌드됩니다.

    # 4. Azure VM에 접속하여 배포 명령 실행 (SSH)
    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          echo "[1/3] 최신 환경변수 파일(.env) 생성 중..."
          
          echo "DB_HOST=${{ secrets.DB_HOST }}" > /home/Alimi/crawler/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> /home/Alimi/crawler/.env
          echo "DB_USER=root" >> /home/Alimi/crawler/.env
          echo "DB_NAME=informserver" >> /home/Alimi/crawler/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /home/Alimi/crawler/.env
          
          chmod 600 /home/Alimi/crawler/.env
          
          echo "[2/3] Docker Hub에서 최신 이미지 당겨오기..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/inform-crawler:latest
          
          docker image prune -f
          
          echo "[3/3] 배포 및 설정 갱신 완료!"