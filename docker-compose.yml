services:
  crawler:
    build: .
    image: in-form_crawler-crawler:latest
    container_name: inform-crawler
    entrypoint: [""]            # 1. 꼬임 방지: 기존 명령어 무시
    working_dir: /app           # 2. 실행 위치 강제: 무조건 /app 안에서 실행해라!
    command: tail -f /dev/null  # 3. 파이참 대기용 생명유지장치
    volumes:
      - .:/app                  # 4. 폴더 연결: 내 윈도우 폴더 = 도커의 /app 폴더

    # 환경변수
    environment:
      - TZ=Asia/Seoul